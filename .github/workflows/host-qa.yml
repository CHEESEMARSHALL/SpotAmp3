# SpotAmp host QA
name: SpotAmp host QA

on:
  push:
  pull_request:

concurrency:
  group: spotamp-host-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-qa:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run host QA tiers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tiers = @('quick', 'storage', 'sync', 'playback', 'downloads', 'qa-backend', 'benchmark', 'release', 'signing')
          foreach ($tier in $tiers) {
            & .\scripts\qa.ps1 $tier
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & .\scripts\qa.ps1 stress -Seed 847229173 -Actions 500
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\qa.ps1 audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotamp-host-qa-results
          path: |
            qa-results/latest
            qa-results/runs
            qa-results/companion-runs
          if-no-files-found: warn
